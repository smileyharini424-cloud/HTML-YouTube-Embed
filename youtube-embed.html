<!DOCTYPE html>
<html>
<head>
    <title>YouTube Video Embed</title>
</head>
<body>

    <h1>HTML YouTube Video</h1>

    <p>
        This page demonstrates how to embed a YouTube video
        using the HTML iframe element.
    </p>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

</body>
</html>
